# Per-IP rate limiting: 10 req/s, burst of 20 (nodelay = burst is served immediately,
# excess gets 429). 10m zone ~= 160k tracked IP addresses.

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

upstream laravel {
    server laravel.test:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    location / {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://laravel;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 60s;
    }

    # Vite emits content-hashed filenames -> safe to cache hard for a year
    location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_pass http://laravel;
    }
}
